name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  ci:
    name: typecheck · lint · test · build · security
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npx prettier --check "src/**/*.ts" "mcp/**/*.ts" "tests/**/*.ts" "examples/**/*.ts" "scripts/**/*.ts"

      - name: Build
        run: npm run build

      - name: Test (unit + integration, with coverage gate)
        run: npm test -- --runInBand --coverage

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Secret scan
        run: |
          if rg -i -n --glob '!node_modules/**' --glob '!dist/**' --glob '!package-lock.json' \
            '(ghp_[A-Za-z0-9]{30,}|sk-[A-Za-z0-9]{20,}|xox[baprs]-[A-Za-z0-9-]{10,}|AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----)' \
            .; then
            echo "::error::Potential secret found in the repository"
            exit 1
          fi
